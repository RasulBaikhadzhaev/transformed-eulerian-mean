name: CI

on:
  push:
    branches: [main, ci-cd]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests and coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          cache: true

      - name: Lint
        run: pixi run lint

      - name: Test with coverage
        run: pixi run coverage
