name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests and coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          cache: true

      - name: Lint
        run: pixi run lint

      - name: Test with coverage
        run: pixi run coverage
